services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # Shared with the worker. Without this the worker writes series into its
      # own filesystem where the backend never sees them.
      - rainfall-cache:/app/.rainfall-cache
      # Usage events land in a volume rather than stdout. The container log is a
      # rotating 3 x 10 MB buffer, so without this the first real user's session
      # is worth about thirty megabytes of log and then gone -- and the
      # instrumentation that gates every later decision measures nothing. Read it
      # with: docker compose exec backend python -m usage
      - usage-events:/app/.usage
    env_file:
      - .env
    environment:
      PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://209.38.197.161,http://localhost:3000}
      # These defaults must track main.py. They were once left at the pre-1.4.0
      # values while the code moved on, which silently pinned the container to a
      # 10 km2 vegetation cap and a single concurrency slot. A test asserts they
      # agree.
      MAX_SYNC_BBOX_KM2: ${MAX_SYNC_BBOX_KM2:-100}
      MAX_LANDCOVER_BBOX_KM2: ${MAX_LANDCOVER_BBOX_KM2:-1000}
      MAX_PC_SCENES: ${MAX_PC_SCENES:-4}
      MAX_SOURCE_TILES: ${MAX_SOURCE_TILES:-64}
      MAX_GEOJSON_BYTES: ${MAX_GEOJSON_BYTES:-4000000}
      MAX_AOI_VERTICES: ${MAX_AOI_VERTICES:-10000}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-8}
      MAX_CONCURRENT_NDVI: ${MAX_CONCURRENT_NDVI:-3}
      ANALYSIS_ACQUIRE_SECONDS: ${ANALYSIS_ACQUIRE_SECONDS:-2}
      NDVI_ACQUIRE_SECONDS: ${NDVI_ACQUIRE_SECONDS:-20}
      ANALYSIS_DRAIN_SECONDS: ${ANALYSIS_DRAIN_SECONDS:-20}
      # Rainfall portfolio. Writable, because the deploy-time --pull writes here.
      RAINFALL_CACHE_DIR: ${RAINFALL_CACHE_DIR:-/app/.rainfall-cache}
      RAINFALL_CACHE_S3_URI: ${RAINFALL_CACHE_S3_URI:-}
      RAINFALL_S3_ENDPOINT: ${RAINFALL_S3_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      RAINFALL_S3_REGION: ${RAINFALL_S3_REGION:-nyc3}
      USAGE_EVENTS_PATH: ${USAGE_EVENTS_PATH:-/app/.usage/events.jsonl}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1800m
    cpus: 1.25
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    restart: on-failure:5

  worker:
    build: .
    # Supervised by the restart policy below, and serialised against other workers
    # by an flock on the shared volume, so a second instance waits rather than
    # duplicating ERA5 reads.
    command: ["python", "-m", "worker", "--interval", "${RAINFALL_WORKER_INTERVAL:-300}"]
    # No portfolio pull: the backend owns that, and two containers fetching the
    # same prefix on every start would be pointless.
    entrypoint: []
    volumes:
      - rainfall-cache:/app/.rainfall-cache
    env_file:
      - .env
    environment:
      RAINFALL_CACHE_DIR: /app/.rainfall-cache
      RAINFALL_CACHE_S3_URI: ${RAINFALL_CACHE_S3_URI:-}
      RAINFALL_S3_ENDPOINT: ${RAINFALL_S3_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      RAINFALL_S3_REGION: ${RAINFALL_S3_REGION:-nyc3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RAINFALL_ALERT_WEBHOOK: ${RAINFALL_ALERT_WEBHOOK:-}
      RAINFALL_ALERT_RULES: ${RAINFALL_ALERT_RULES:-}
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    # An unhealthy worker that keeps failing should restart rather than spin.
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-/api}
        BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  rainfall-cache:
  usage-events:
